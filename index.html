<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Queen Screener PRO V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090e16;color:#eee;font-family:Arial,sans-serif;padding:16px}
h2{color:#50d6ad;margin:8px 0}
.sub{color:#9ba8b8;font-size:12px}
.panel{background:#151e2b;padding:14px;border-radius:12px;margin:14px 0}
button,select,input{padding:12px;background:#202d40;color:white;border:1px solid #40516a;border-radius:7px;margin:4px}
button{cursor:pointer}
button.active{background:#168b68}
#scan{background:#168b68;font-weight:bold;width:100%;padding:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#202d40;padding:12px;border-radius:8px}
.stat b{display:block;font-size:21px;margin-top:5px}
.item{background:#151e2b;padding:12px;border-radius:9px;margin:9px 0;border-left:4px solid #777}
.short{border-color:#ff5968}
.long{border-color:#16c78b}
.red{color:#ff5968}.green{color:#16c78b}
small{color:#9ba8b8}
a{color:#65b9ff}
table{width:100%;font-size:12px;border-collapse:collapse}
td,th{padding:8px 4px;text-align:left;border-bottom:1px solid #293548}
#progress{height:7px;background:#293548;border-radius:8px;overflow:hidden}
#bar{height:100%;width:0;background:#16c78b}
</style>
</head>
<body>

<h2>👑 QUEEN SCREENER PRO V2</h2>
<div class="sub">BINANCE FUTURES • QUEEN LIQUIDITY SWEEP</div>

<div class="panel">
<b>TIMEFRAME</b><br>
<select id="tf">
<option value="4h">4H</option>
<option value="1h">1H</option>
<option value="15m">15M</option>
<option value="1d">1D</option>
</select>
<br>
<b>ARAH SINYAL</b><br>
<select id="side">
<option value="ALL">LONG + SHORT</option>
<option value="SHORT">SHORT saja</option>
<option value="LONG">LONG saja</option>
</select>
<br>
<b>Panjang struktur</b><br>
<input id="len" type="number" value="20" min="3" max="100">
<br>
<b>Cari koin</b><br>
<input id="search" placeholder="Contoh: BTC">
<button id="scan" onclick="startScan()">🔍 MULAI SCAN</button>
<button onclick="stopScan()">STOP</button>
<div id="status" class="sub">Siap memindai Binance Futures</div>
<div id="progress"><div id="bar"></div></div>
</div>

<div class="stats">
<div class="stat">Dipindai<b id="total">0</b></div>
<div class="stat">SHORT 🔴<b id="ns">0</b></div>
<div class="stat">LONG 🟢<b id="nl">0</b></div>
</div>

<div class="panel">
<b>HASIL QUEEN</b>
<div class="sub">Diurutkan berdasarkan kekuatan sweep dan rejection.</div>
<div id="results">Belum ada hasil scan.</div>
</div>

<script>
const API="https://fapi.binance.com";
let stopped=false;
let busy=false;

const $=id=>document.getElementById(id);

function fmt(n){
 return Number(n).toPrecision(7);
}

function atr(data,end,period=14){
 let trs=[];
 for(let i=1;i<=end;i++){
  let h=+data[i][2],l=+data[i][3],pc=+data[i-1][4];
  trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
 }
 if(trs.length<period)return 0;
 let a=trs.slice(0,period).reduce((x,y)=>x+y,0)/period;
 for(let i=period;i<trs.length;i++)
  a=(a*(period-1)+trs[i])/period;
 return a;
}
function analyze(data,symbol,period,len){
  const i=data.length-2;
  if(i<len+2) return null;

  const c=data[i];
  const open=+c[1];
  const high=+c[2];
  const low=+c[3];
  const close=+c[4];

  const a=atr(data,i,14);
  if(!a || a<=0) return null;

  const tolerance=a*0.30;
  const maxDistance=a*1.20;
  const firstBreak=Math.max(len,i-6);

  for(let b=i-1;b>=firstBreak;b--){
    const previous=data.slice(b-len,b);
    if(previous.length<len) continue;

    const keyHigh=Math.max(...previous.map(x=>+x[2]));
    const keyLow=Math.min(...previous.map(x=>+x[3]));

    const bo=+data[b][1];
    const bc=+data[b][4];

    // LONG: breakout resistance
    const longBreak=bc>keyHigh && bc>bo;

    if(longBreak){
      let valid=true;

      for(let j=b+1;j<i;j++){
        if(+data[j][4]<=keyHigh) valid=false;
      }

      const retest=
        low<=keyHigh+tolerance &&
        low>=keyHigh-tolerance &&
        close>keyHigh &&
        close>open &&
        close-keyHigh<=maxDistance;

      if(valid && retest){
        const entry=close;
        const sl=low-a*0.15;
        const risk=entry-sl;
        if(risk<=0) continue;

        const range=Math.max(high-low,0.00000001);
        const wick=Math.min(open,close)-low;
        const strength=Math.min(100,
          Math.round((wick/range)*70+
          (Math.abs(close-open)/range)*30)
        );

        return {
          symbol,side:"LONG",entry,sl,
          tp1:entry+risk,
          tp2:entry+risk*2,
          tp3:entry+risk*3,
          strength,time:c[0],interval:period
        };
      }
    }

    // SHORT: breakdown support
    const shortBreak=bc<keyLow && bc<bo;

    if(shortBreak){
      let valid=true;

      for(let j=b+1;j<i;j++){
        if(+data[j][4]>=keyLow) valid=false;
      }

      const retest=
        high>=keyLow-tolerance &&
        high<=keyLow+tolerance &&
        close<keyLow &&
        close<open &&
        keyLow-close<=maxDistance;

      if(valid && retest){
        const entry=close;
        const sl=high+a*0.15;
        const risk=sl-entry;
        if(risk<=0) continue;

        const range=Math.max(high-low,0.00000001);
        const wick=high-Math.max(open,close);
        const strength=Math.min(100,
          Math.round((wick/range)*70+
          (Math.abs(close-open)/range)*30)
        );

        return {
          symbol,side:"SHORT",entry,sl,
          tp1:entry-risk,
          tp2:entry-risk*2,
          tp3:entry-risk*3,
          strength,time:c[0],interval:period
        };
      }
    }
  }

  return null;
}


async function getSymbols(){
 const r=await fetch(API+"/fapi/v1/exchangeInfo");
 if(!r.ok)throw Error("Binance exchangeInfo gagal");
 const j=await r.json();
 return j.symbols.filter(x=>
  x.status==="TRADING"&&
  x.contractType==="PERPETUAL"&&
  x.quoteAsset==="USDT"
 ).map(x=>x.symbol);
}

async function getCandles(symbol,tf){
 const url=API+"/fapi/v1/klines?symbol="+symbol+
 "&interval="+tf+"&limit=100";
 const r=await fetch(url);
 if(!r.ok)throw Error("Kline gagal");
 return await r.json();
}

async function startScan(){
 if(busy)return;
 busy=true;stopped=false;
 $("results").innerHTML="Memulai pemindaian...";
 $("total").textContent="0";
 $("ns").textContent="0";
 $("nl").textContent="0";
 $("bar").style.width="0%";
 let found=[],done=0,errors=0;

 try{
  const tf=$("tf").value;
  const len=Math.max(3,Math.min(100,+$("len").value||20));
  const side=$("side").value;
  const query=$("search").value.trim().toUpperCase();

  let symbols=await getSymbols();
  if(query)symbols=symbols.filter(s=>s.includes(query));

  const total=symbols.length;
  $("status").textContent="Memindai "+total+" pasangan...";

  let cursor=0;
  async function worker(){
   while(cursor<total&&!stopped){
    const symbol=symbols[cursor++];
    try{
     const data=await getCandles(symbol,tf);
     const result=analyze(data,symbol,tf,len);
     if(result&&(side==="ALL"||result.side===side))
      found.push(result);
    }catch(e){errors++}
    done++;
    $("total").textContent=done;
    $("bar").style.width=(done/total*100)+"%";
    $("status").textContent=
     "Memindai "+done+"/"+total+" • gagal "+errors;
    $("ns").textContent=found.filter(x=>x.side==="SHORT").length;
    $("nl").textContent=found.filter(x=>x.side==="LONG").length;
   }
  }

  await Promise.all(Array.from({length:8},()=>worker()));
  found.sort((a,b)=>b.strength-a.strength);
  render(found);
  $("status").textContent=stopped?
   "Scan dihentikan • "+done+" diperiksa":
   "Selesai • "+done+" diperiksa • gagal "+errors;
 }catch(e){
  $("status").textContent="ERROR: "+e.message;
  $("results").textContent="Periksa koneksi internet dan coba lagi.";
 }
 busy=false;
}

function render(items){
 if(!items.length){
  $("results").innerHTML="Belum ditemukan sinyal Queen pada candle terakhir yang sudah tutup.";
  return;
 }
 $("results").innerHTML=items.map(x=>{
  const s=x.side==="SHORT";
  const cls=s?"short":"long";
  const color=s?"red":"green";
  const url="https://www.binance.com/en/futures/"+x.symbol;
  return `<div class="item ${cls}">
   <b class="${color}">${s?"🔴 SHORT":"🟢 LONG"} • ${x.symbol}</b>
   <small> • ${x.interval.toUpperCase()}</small>
   <table>
   <tr><td>ENTRY</td><td>${fmt(x.entry)}</td></tr>
   <tr><td>STOP LOSS</td><td class="red">${fmt(x.sl)}</td></tr>
   <tr><td>TP1 MID</td><td>${fmt(x.tp1)}</td></tr>
   <tr><td>TP2 STRUCTURE</td><td>${fmt(x.tp2)}</td></tr>
   <tr><td>TP3 EXTENSION</td><td>${fmt(x.tp3)}</td></tr>
   </table>
   <small>Kekuatan sweep: ${x.strength.toFixed(2)} ATR</small><br>
   <a href="${url}" target="_blank">BUKA CHART BINANCE ↗</a>
  </div>`;
 }).join("");
}

function stopScan(){stopped=true}
</script>
</body>
</html>
